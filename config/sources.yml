# Per-source ingestion config: endpoints, params, rate limits.
# Phase 1 implements ITviec only; TopDev / VietnamWorks are declared but stubbed.

defaults:
  # Responsible-scraping knobs (enforced in pipeline/utils/http.py).
  min_delay_seconds: 3
  max_delay_seconds: 8
  request_timeout_seconds: 45
  max_retries: 3
  rotate_user_agent: true
  respect_robots: true
  # Route live fetches through ScraperAPI. If a ScraperAPI call fails and
  # allow_direct_fallback is true, fall back to a direct request (logged).
  use_scraperapi: true
  allow_direct_fallback: true
  scraperapi_render: false  # ITviec listings are server-rendered; no JS render needed.
  # scraperapi_country_code: vn   # geotargeting is a PAID feature; leave unset on free plan.

sources:
  itviec:
    enabled: true
    base_url: "https://itviec.com"
    # ITviec exposes Data jobs as keyword/skill category pages: /it-jobs/<slug>?page=N
    # These overlap (a posting can carry several tags); the connector dedups by job UUID.
    listing_path: "/it-jobs/{category}"
    page_param: "page"
    # Categories swept for the Vietnam Data domain. Extended 2026-08-09 to cover the whole
    # taxonomy: eleven families had no keyword of their own anywhere and were surviving only
    # on the generic `data` catch-all (BUSINESS_ANALYST is the corpus's largest family at 155
    # postings and nothing searched for it directly). Every slug below was probed and returns
    # cards; `sql` was left out because every backend role mentions it.
    categories:
      # roles the pipeline always covered
      - data-engineer
      - data-analyst
      - data-scientist
      - machine-learning
      - business-intelligence
      - big-data
      - ai-engineer
      - etl
      - data-warehouse
      # ANALYTICS: BUSINESS_ANALYST, PRODUCT_ANALYST
      - business-analyst
      - product-analyst
      # GOVERNANCE_ARCH + DATABASE: DATA_ARCHITECT, DBA_DATABASE
      - data-architect
      - database-administrator
      # AI_ML: MLOPS, CV_NLP, GENAI_LLM
      - mlops
      - computer-vision
      - nlp
      - generative-ai
      - llm
      - deep-learning
      # tool names that in practice only appear on Data postings
      - power-bi
      - tableau
      - spark
    cards_per_page: 20
    max_pages_per_category: 10

  topdev:
    # api.topdev.vn is robots.txt Disallow:/ and the HTML has no search data.
    # OVERRIDE enabled 2026-06-15 by explicit operator decision for PERSONAL/EDUCATIONAL
    # use only (not redistribution). To revert to compliant default, set enabled:false,
    # respect_robots:true, robots_override_ack:false. See ingest/topdev.py.
    enabled: true
    use_scraperapi: false
    respect_robots: false
    robots_override_ack: true
    base_url: "https://topdev.vn"
    jobs_api: "https://api.topdev.vn/td/v2/jobs"
    # Keyword search recycles results (~73 distinct/keyword even when logged in), so
    # coverage comes from many Data-specific keywords, deduped. (Login adds nothing —
    # verified 2026-06-16.) Keywords kept Data-precise to avoid non-Data noise.
    # `data` stays: measured 2026-08-09, dropping it would lose 90% of TopDev's output and
    # take real Data postings with it. The narrower keywords below are what stop it having
    # to carry the whole taxonomy on its own.
    queries: [data, "data engineer", "data analyst", "data scientist", "data analytics",
              "big data", "data warehouse", "data architect", "data platform",
              "business intelligence", "machine learning", "analytics engineer",
              "etl", "mlops", "databricks",
              # added 2026-08-09 for taxonomy coverage
              "business analyst", "product analyst", "data governance", "dataops",
              "database administrator", "computer vision", "nlp", "generative ai",
              "llm", "deep learning", "power bi", "tableau"]
    max_pages_per_query: 10   # TopDev fixes per_page=10

  vietnamworks:
    enabled: true
    use_scraperapi: false      # public JSON API, robots-allowed (no robots.txt) -> direct
    respect_robots: true
    base_url: "https://www.vietnamworks.com"
    search_api: "https://ms.vietnamworks.com/job-search/v1.0/search"
    hits_per_page: 100
    # `data` stays: it alone found 84% of VietnamWorks' output, including families with no
    # keyword of their own. Extended 2026-08-09 so it no longer has to.
    queries: [data, "data engineer", "data analyst", "data scientist",
              "machine learning", "business intelligence", "analytics engineer",
              "business analyst", "product analyst", "data architect",
              "data governance", "database administrator", "big data",
              "data warehouse", "etl", "mlops", "dataops",
              "computer vision", "nlp", "generative ai", "llm", "power bi"]
    max_pages_per_query: 10

  glints:
    enabled: true
    use_scraperapi: false      # GraphQL API is robots-allowed + anonymous -> direct
    respect_robots: true
    graphql_api: "https://glints.com/api/v2/graphql"
    page_size: 30
    # `data` appeared twice in this list — the second one cost a full paginated sweep and
    # returned nothing new. Removed 2026-08-09; the rest is taxonomy coverage.
    queries: [data, "data engineer", "data analyst", "data scientist",
              "machine learning", "business intelligence", "analytics engineer",
              "etl", "power bi",
              "business analyst", "product analyst", "data architect",
              "data governance", "database administrator", "big data",
              "mlops", "computer vision", "nlp", "generative ai", "llm"]
    max_pages_per_query: 10

  vieclam24h:
    # Added 2026-08-09 as a seventh board. Next.js app: the postings ship inside the
    # __NEXT_DATA__ script tag rather than the rendered HTML, so a plain GET is enough —
    # no browser, no render service, and the requirement text is inline so no per-job
    # detail fetch and no ScraperAPI credits.
    #
    # robots.txt allows these paths; it only disallows /admin/, /asset/, /taikhoan/ and
    # /*?q. The site's own /viec-lam-<role> URLs redirect into the ?q= search route, which
    # is why the occupation-group path below is used instead. Pagination is ?page=N.
    #
    # The occupation pages are a loose feed, not a strict filter. Measured 2026-08-09 by
    # title: data-engineer 35% Data-relevant, business-intelligence-analyst 25%,
    # data-analyst 8%. Tier 0 plus the labeling engine are what make that usable, and every
    # posting carries its requirement text so a judge has something real to read.
    #
    # Two of the group's six occupations are not swept:
    #   nhap-lieu                     data entry, not a Data role
    #   market-research-and-analysis  149 postings at 2% relevance — market research and
    #                                 sales, the single largest source of waste measured
    enabled: true
    use_scraperapi: false      # server-rendered state, robots-allowed, no anti-bot -> direct
    respect_robots: true
    base_url: "https://vieclam24h.vn"
    occupation_group: "viec-lam-phan-tich-thong-ke-du-lieu"
    categories: [data-engineer, data-analyst, data-scientist,
                 business-intelligence-analyst]
    cards_per_page: 20
    max_pages_per_category: 8

  careerviet:
    enabled: true
    use_scraperapi: false      # openresty, server-rendered HTML, no Cloudflare -> direct
    respect_robots: true
    base_url: "https://careerviet.vn"
    # Targeted role keywords (broad "data" over-matches); deduped by job id.
    # Extended 2026-08-09 for taxonomy coverage — every slug probed and returning real
    # postings (`dba` returns "Chuyên viên quản trị cơ sở dữ liệu (DBA)", `power-bi`
    # returns Data Analyst roles). `research-scientist` was dropped: it returns 0.
    categories: [data-engineer, data-analyst, data-scientist, machine-learning,
                 business-intelligence, data-warehouse,
                 # ANALYTICS: BUSINESS_ANALYST, PRODUCT_ANALYST, RISK_FRAUD_ANALYST
                 business-analyst, product-analyst, risk-analyst,
                 # GOVERNANCE_ARCH + DATABASE
                 data-architect, data-governance, database-administrator, dba,
                 # DATA_ENGINEERING: DATAOPS
                 dataops,
                 # AI_ML: MLOPS, CV_NLP, GENAI_LLM
                 mlops, computer-vision, nlp, generative-ai, llm, deep-learning,
                 # tool names that in practice only appear on Data postings
                 power-bi, tableau, spark]
    cards_per_page: 50
    max_pages_per_category: 5
